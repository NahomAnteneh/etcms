openapi: 3.0.3
info:
  title: etcms Configuration Management System API
  version: 3.0.0
  description: Enterprise-grade manual-first Configuration Management System (CMS) backend.
servers:
  - url: /
paths:
  /api/v1/healthz:
    get:
      summary: Liveness probe
      operationId: getHealthz
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/readyz:
    get:
      summary: Readiness probe
      operationId: getReadyz
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Service is not ready
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/users/me:
    get:
      summary: Get currently authenticated user profile
      operationId: getCurrentUser
      security:
        - BearerAuth: []
        - DevAuth: []
      responses:
        '200':
          description: Authenticated user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/owner-groups:
    get:
      summary: List all owner groups
      operationId: listOwnerGroups
      security:
        - BearerAuth: []
        - DevAuth: []
      responses:
        '200':
          description: List of owner groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OwnerGroup'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/intake/campaigns:
    post:
      summary: Create a decentralized intake campaign
      operationId: createIntakeCampaign
      security:
        - BearerAuth: []
        - DevAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
      responses:
        '201':
          description: Intake campaign created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden - requires platform_admin role
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Unprocessable entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/intake/campaigns/{id}/progress:
    get:
      summary: Get intake campaign progress by department
      operationId: getCampaignProgress
      security:
        - BearerAuth: []
        - DevAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Campaign progress breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignProgressResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Campaign not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/intake/{token}:
    get:
      summary: Resolve intake invitation magic link token
      operationId: getIntakeInvitation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Intake invitation context and active draft
          headers:
            ETag:
              schema:
                type: string
              description: Current draft lock version quoted e.g. "1"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeContextResponse'
        '401':
          description: Token expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Token not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      summary: Auto-save intake draft
      operationId: saveIntakeDraft
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
          description: Quoted or raw lock version string (e.g. "1")
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDraftRequest'
      responses:
        '200':
          description: Draft auto-saved successfully
          headers:
            ETag:
              schema:
                type: string
              description: Updated draft lock version quoted e.g. "2"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveDraftResponse'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Token expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Token not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
          description: Precondition Failed - Optimistic lock version conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '413':
          description: Payload Too Large - Exceeds 2MB limit
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/intake/{token}/submit:
    post:
      summary: Submit intake and publish baseline
      operationId: submitIntake
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: Optional idempotency key for safe retries
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitIntakeRequest'
      responses:
        '200':
          description: Baseline already published (idempotent retry)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineResponse'
        '201':
          description: Baseline published successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineResponse'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Token expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Token not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict - Submission already finalized or state conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Unprocessable Entity - Validation or Anti-ITAM errors
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/cis/search:
    get:
      summary: Search configuration items
      operationId: searchCIs
      security:
        - BearerAuth: []
        - DevAuth: []
        - IntakeTokenAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Trigram or prefix search query string
        - name: ci_class
          in: query
          required: false
          schema:
            type: string
            enum:
              - business_service
              - application
              - database
              - vm_cluster
              - physical_host
              - network_firewall
        - name: environment
          in: query
          required: false
          schema:
            type: string
            enum:
              - prod
              - dr
              - staging
        - name: owner_group_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CISearchResponse'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/owner-groups/pending-edges:
    get:
      summary: List pending cross-boundary edges awaiting confirmation
      operationId: listPendingEdges
      tags:
        - Edges
      security:
        - BearerAuth: []
        - DevAuth: []
      parameters:
        - name: owner_group_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Optional filter by specific target owner group ID
      responses:
        '200':
          description: List of pending edges awaiting confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingEdgesResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/edges/{id}/confirm:
    post:
      summary: Confirm cross-boundary edge handshake
      operationId: confirmEdge
      tags:
        - Edges
      security:
        - BearerAuth: []
        - DevAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Edge confirmed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Edge not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: State machine conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/edges/{id}/flag-mismatch:
    post:
      summary: Flag cross-boundary edge mismatch
      operationId: flagEdgeMismatch
      tags:
        - Edges
      security:
        - BearerAuth: []
        - DevAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagMismatchRequest'
      responses:
        '200':
          description: Edge flagged as mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Edge not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: State machine conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/edges/{id}/reject:
    post:
      summary: Reject cross-boundary edge
      operationId: rejectEdge
      tags:
        - Edges
      security:
        - BearerAuth: []
        - DevAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectEdgeRequest'
      responses:
        '200':
          description: Edge rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Edge not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: State machine conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/cis:
    post:
      summary: Create a single configuration item post-baseline
      operationId: createCI
      tags:
        - CIs
      security:
        - BearerAuth: []
        - DevAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCIRequest'
      responses:
        '201':
          description: Configuration item created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIEnvelope'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Owner group not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict (e.g. duplicate active CI name)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Unprocessable entity (e.g. anti-ITAM or validation rule violated)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/cis/{id}:
    get:
      summary: Get configuration item detail with graph summary and verification status
      operationId: getCIDetail
      tags:
        - CIs
      security:
        - BearerAuth: []
        - DevAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: CI detail retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIDetailResponse'
        '400':
          description: Bad request (invalid UUID format)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: CI not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/cis/{id}/impact-upward:
    get:
      summary: Traverse upward impact graph for a configuration item
      operationId: getUpwardImpact
      tags:
        - Graph
        - CIs
      security:
        - BearerAuth: []
        - DevAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: include_retired
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Upward impact traversal completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpwardImpactResponse'
        '400':
          description: Bad request (invalid UUID format)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: CI not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/cis/{id}/dependencies-downward:
    get:
      summary: Traverse downward dependency graph for a configuration item
      operationId: getDownwardDependencies
      tags:
        - Graph
        - CIs
      security:
        - BearerAuth: []
        - DevAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: include_retired
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Downward dependency traversal completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownwardDependenciesResponse'
        '400':
          description: Bad request (invalid UUID format)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: CI not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/edges:
    post:
      summary: Create a single edge dependency post-baseline
      operationId: createEdge
      tags:
        - Edges
      security:
        - BearerAuth: []
        - DevAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEdgeRequest'
      responses:
        '201':
          description: Edge created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeResponse'
        '400':
          description: Bad request (e.g. self-loop)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden (caller does not belong to source CI owner group)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Source or target CI not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict (edge already exists or target CI retired)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Unprocessable entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/edges/{id}:
    delete:
      summary: Soft-disconnect a graph edge with audit trail
      operationId: deleteEdge
      tags:
        - Edges
      security:
        - BearerAuth: []
        - DevAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Edge disconnected successfully
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden (caller does not belong to source or target owner group)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Edge not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    DevAuth:
      type: apiKey
      in: header
      name: X-Dev-User-ID
    IntakeTokenAuth:
      type: apiKey
      in: header
      name: X-Intake-Token

  schemas:
    ProblemDetails:
      type: object
      additionalProperties: false
      required:
        - title
        - status
        - detail
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          nullable: true
        invalid_params:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - reason
            properties:
              name:
                type: string
              reason:
                type: string
        node_errors:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string

    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - version
        - timestamp
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        version:
          type: string
        timestamp:
          type: string
          format: date-time

    ReadyResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - database
        - timestamp
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        database:
          type: string
          enum: [connected, disconnected]
        timestamp:
          type: string
          format: date-time

    OwnershipHeader:
      type: object
      additionalProperties: false
      required:
        - owner_group_id
        - owner_group_name
        - department_name
        - technical_contact
        - team_lead_name
        - team_lead_email
      properties:
        owner_group_id:
          type: string
          format: uuid
        owner_group_name:
          type: string
        department_name:
          type: string
        technical_contact:
          type: string
        team_lead_name:
          type: string
        team_lead_email:
          type: string
          format: email

    CIEnvelope:
      type: object
      additionalProperties: false
      required:
        - name
        - ci_class
        - environment
        - lifecycle_state
        - criticality_tier
        - owner_group_id
        - technical_contact
        - class_metadata
      properties:
        ci_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 160
        ci_class:
          type: string
          enum:
            - business_service
            - application
            - database
            - vm_cluster
            - physical_host
            - network_firewall
        environment:
          type: string
          enum:
            - prod
            - dr
            - staging
        lifecycle_state:
          type: string
          enum:
            - planned
            - in_service
            - deprecated
            - retired
          default: in_service
        criticality_tier:
          type: string
          enum:
            - tier_0
            - tier_1
            - tier_2
            - tier_3
        owner_group_id:
          type: string
          format: uuid
        technical_contact:
          type: string
          minLength: 1
          maxLength: 160
        primary_endpoint:
          type: string
          nullable: true
          maxLength: 255
        last_verified_at:
          type: string
          format: date-time
          readOnly: true
        itam_external_ref:
          type: string
          nullable: true
          maxLength: 512
        class_metadata:
          type: object
          maxProperties: 2
          additionalProperties:
            type: string
        ownership:
          $ref: '#/components/schemas/OwnershipHeader'
        created_at:
