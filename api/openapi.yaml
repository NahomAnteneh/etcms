openapi: 3.0.3
info:
  title: etcms Configuration Management System API
  version: 3.0.0
  description: Enterprise-grade manual-first Configuration Management System (CMS) backend.
servers:
  - url: /
paths:
  /api/v1/healthz:
    get:
      summary: Liveness probe
      operationId: getHealthz
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/readyz:
    get:
      summary: Readiness probe
      operationId: getReadyz
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Service is not ready
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/users/me:
    get:
      summary: Get currently authenticated user profile
      operationId: getCurrentUser
      security:
        - BearerAuth: []
        - DevAuth: []
      responses:
        '200':
          description: Authenticated user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/owner-groups:
    get:
      summary: List all owner groups
      operationId: listOwnerGroups
      security:
        - BearerAuth: []
        - DevAuth: []
      responses:
        '200':
          description: List of owner groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OwnerGroup'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/intake/campaigns:
    post:
      summary: Create a decentralized intake campaign
      operationId: createIntakeCampaign
      security:
        - BearerAuth: []
        - DevAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
      responses:
        '201':
          description: Intake campaign created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden - requires platform_admin role
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Unprocessable entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/intake/campaigns/{id}/progress:
    get:
      summary: Get intake campaign progress by department
      operationId: getCampaignProgress
      security:
        - BearerAuth: []
        - DevAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Campaign progress breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignProgressResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Campaign not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/intake/{token}:
    get:
      summary: Resolve intake invitation magic link token
      operationId: getIntakeInvitation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Intake invitation context and active draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeContextResponse'
        '401':
          description: Token expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Token not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    DevAuth:
      type: apiKey
      in: header
      name: X-Dev-User-ID

  schemas:
    ProblemDetails:
      type: object
      additionalProperties: false
      required:
        - title
        - status
        - detail
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          nullable: true
        invalid_params:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - reason
            properties:
              name:
                type: string
              reason:
                type: string
        node_errors:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string

    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - version
        - timestamp
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        version:
          type: string
        timestamp:
          type: string
          format: date-time

    ReadyResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - database
        - timestamp
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        database:
          type: string
          enum: [connected, disconnected]
        timestamp:
          type: string
          format: date-time

    OwnershipHeader:
      type: object
      additionalProperties: false
      required:
        - owner_group_id
        - owner_group_name
        - department_name
        - technical_contact
        - team_lead_name
        - team_lead_email
      properties:
        owner_group_id:
          type: string
          format: uuid
        owner_group_name:
          type: string
        department_name:
          type: string
        technical_contact:
          type: string
        team_lead_name:
          type: string
        team_lead_email:
          type: string
          format: email

    CIEnvelope:
      type: object
      additionalProperties: false
      required:
        - name
        - ci_class
        - environment
        - lifecycle_state
        - criticality_tier
        - owner_group_id
        - technical_contact
        - class_metadata
      properties:
        ci_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 160
        ci_class:
          type: string
          enum:
            - business_service
            - application
            - database
            - vm_cluster
            - physical_host
            - network_firewall
        environment:
          type: string
          enum:
            - prod
            - dr
            - staging
        lifecycle_state:
          type: string
          enum:
            - planned
            - in_service
            - deprecated
            - retired
          default: in_service
        criticality_tier:
          type: string
          enum:
            - tier_0
            - tier_1
            - tier_2
            - tier_3
        owner_group_id:
          type: string
          format: uuid
        technical_contact:
          type: string
          minLength: 1
          maxLength: 160
        primary_endpoint:
          type: string
          nullable: true
          maxLength: 255
        last_verified_at:
          type: string
          format: date-time
          readOnly: true
        itam_external_ref:
          type: string
          nullable: true
          maxLength: 512
        class_metadata:
          type: object
          maxProperties: 2
          additionalProperties:
            type: string
        ownership:
          $ref: '#/components/schemas/OwnershipHeader'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    User:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - name
        - role
        - owner_group_ids
        - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [viewer, team_lead, platform_admin]
        primary_owner_group_id:
          type: string
          format: uuid
          nullable: true
        owner_group_ids:
          type: array
          items:
            type: string
            format: uuid
        created_at:
          type: string
          format: date-time

    OwnerGroup:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - department_name
        - team_lead_name
        - team_lead_email
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        department_name:
          type: string
        team_lead_name:
          type: string
        team_lead_email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time

    CreateCampaignRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - deadline
        - owner_group_ids
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        deadline:
          type: string
          format: date-time
        owner_group_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    CampaignInvitation:
      type: object
      additionalProperties: false
      required:
        - invitation_id
        - owner_group_id
        - owner_group_name
        - department_name
        - team_lead_name
        - team_lead_email
        - invitation_url
        - expires_at
      properties:
        invitation_id:
          type: string
          format: uuid
        owner_group_id:
          type: string
          format: uuid
        owner_group_name:
          type: string
        department_name:
          type: string
        team_lead_name:
          type: string
        team_lead_email:
          type: string
          format: email
        invitation_url:
          type: string
        expires_at:
          type: string
          format: date-time

    CampaignResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - status
        - deadline
        - created_at
        - invitations
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [active, closed, archived]
        deadline:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/CampaignInvitation'

    DepartmentProgress:
      type: object
      additionalProperties: false
      required:
        - department_name
        - total_invitations
        - sent_count
        - opened_count
        - submitted_count
        - overdue_count
      properties:
        department_name:
          type: string
        total_invitations:
          type: integer
        sent_count:
          type: integer
        opened_count:
          type: integer
        submitted_count:
          type: integer
        overdue_count:
          type: integer

    CampaignProgressResponse:
      type: object
      additionalProperties: false
      required:
        - campaign_id
        - title
        - status
        - deadline
        - total_invitations
        - total_sent
        - total_opened
        - total_submitted
        - total_overdue
        - departments
      properties:
        campaign_id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [active, closed, archived]
        deadline:
          type: string
          format: date-time
        total_invitations:
          type: integer
        total_sent:
          type: integer
        total_opened:
          type: integer
        total_submitted:
          type: integer
        total_overdue:
          type: integer
        departments:
          type: array
          items:
            $ref: '#/components/schemas/DepartmentProgress'

    IntakeContextResponse:
      type: object
      additionalProperties: false
      required:
        - invitation_id
        - campaign_id
        - campaign_title
        - deadline
        - owner_group_id
        - owner_group_name
        - department_name
        - team_lead_name
        - team_lead_email
        - status
        - lock_version
      properties:
        invitation_id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
        campaign_title:
          type: string
        deadline:
          type: string
          format: date-time
        owner_group_id:
          type: string
          format: uuid
        owner_group_name:
          type: string
        department_name:
          type: string
        team_lead_name:
          type: string
        team_lead_email:
          type: string
          format: email
        status:
          type: string
          enum: [sent, opened, submitted, expired]
        draft_payload:
          type: object
          additionalProperties: true
        lock_version:
          type: integer
