version: "2"
sql:
  - schema: "migrations"
    queries: "sql/queries"
    engine: "postgresql"
    gen:
      go:
        package: "gen"
        out: "internal/adapters/postgres/gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid[]"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              slice: true
          - db_type: "timestamptz"
            go_type: "time.Time"
