components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    DevAuth:
      type: apiKey
      in: header
      name: X-Dev-User-ID
    IntakeTokenAuth:
      type: apiKey
      in: header
      name: X-Intake-Token

  schemas:
    ProblemDetails:
      type: object
      additionalProperties: false
      required:
        - title
        - status
        - detail
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          nullable: true
        invalid_params:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - reason
            properties:
              name:
                type: string
              reason:
                type: string
        node_errors:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string
        dependent_cis:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: false
            required:
              - ci_id
              - name
              - ci_class
              - environment
            properties:
              ci_id:
                type: string
                format: uuid
              name:
                type: string
              ci_class:
                type: string
              environment:
                type: string
                enum:
                  - prod
                  - dr
                  - staging

    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - version
        - timestamp
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        version:
          type: string
        timestamp:
          type: string
          format: date-time

    ReadyResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - database
        - timestamp
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        database:
          type: string
          enum: [connected, disconnected]
        timestamp:
          type: string
          format: date-time

    OwnershipHeader:
      type: object
      additionalProperties: false
      required:
        - owner_group_id
        - owner_group_name
        - department_name
        - technical_contact
        - team_lead_name
        - team_lead_email
      properties:
        owner_group_id:
          type: string
          format: uuid
        owner_group_name:
          type: string
        department_name:
          type: string
        technical_contact:
          type: string
        team_lead_name:
          type: string
        team_lead_email:
          type: string
          format: email

    CIEnvelope:
      type: object
      additionalProperties: false
      required:
        - name
        - ci_class
        - environment
        - lifecycle_state
        - criticality_tier
        - owner_group_id
        - technical_contact
        - class_metadata
      properties:
        ci_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 160
        ci_class:
          type: string
        environment:
          type: string
          enum:
            - prod
            - dr
            - staging
        lifecycle_state:
          type: string
          enum:
            - in_service
            - synced
            - out_of_sync
            - planned
            - deprecated
            - retired
          default: in_service
        criticality_tier:
          type: string
          enum:
            - tier_0
            - tier_1
            - tier_2
            - tier_3
        owner_group_id:
          type: string
          format: uuid
        technical_contact:
          type: string
          minLength: 1
          maxLength: 160
        primary_endpoint:
          type: string
          nullable: true
          maxLength: 255
        last_verified_at:
          type: string
          format: date-time
          readOnly: true
        itam_external_ref:
          type: string
          nullable: true
          maxLength: 512
        class_metadata:
          type: object
          additionalProperties:
            type: string
        ownership:
          $ref: '#/components/schemas/OwnershipHeader'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    User:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - name
        - role
        - owner_group_ids
        - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [viewer, team_lead, platform_admin]
        primary_owner_group_id:
          type: string
          format: uuid
          nullable: true
        custom_role_id:
          type: string
          format: uuid
          nullable: true
        custom_role_name:
          type: string
          nullable: true
        custom_role_permissions:
          type: array
          nullable: true
          items:
            type: string
        owner_group_ids:
          type: array
          items:
            type: string
            format: uuid
        status:
          type: string
          default: active
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OwnerGroup:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - department_name
        - team_lead_name
        - team_lead_email
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        department_name:
          type: string
        team_lead_name:
          type: string
        team_lead_email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time

    CreateOwnerGroupRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - department_name
        - team_lead_name
        - team_lead_email
      properties:
        name:
          type: string
        slug:
          type: string
        department_name:
          type: string
        team_lead_name:
          type: string
        team_lead_email:
          type: string
          format: email

    UpdateOwnerGroupRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - department_name
        - team_lead_name
        - team_lead_email
      properties:
        name:
          type: string
        slug:
          type: string
        department_name:
          type: string
        team_lead_name:
          type: string
        team_lead_email:
          type: string
          format: email

    CIFormField:
      type: object
      additionalProperties: false
      required:
        - name
        - label
        - type
      properties:
        name:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [text, number, select, boolean]
        required:
          type: boolean
        placeholder:
          type: string
        options:
          type: array
          items:
            type: string
        default_value:
          type: string

    CIClassDefinition:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - category
        - description
        - icon
        - is_system
        - attributes
        - created_at
        - updated_at
      properties:
        id:
          type: string
        label:
          type: string
        category:
          type: string
        description:
          type: string
        icon:
          type: string
        is_system:
          type: boolean
        attributes:
          type: array
          items:
            type: string
        form_fields:
          type: array
          items:
            $ref: '#/components/schemas/CIFormField'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateCIClassRequest:
      type: object
      additionalProperties: false
      required:
        - id
        - label
      properties:
        id:
          type: string
        label:
          type: string
        category:
          type: string
        description:
          type: string
        icon:
          type: string
        attributes:
          type: array
          items:
            type: string
        form_fields:
          type: array
          items:
            $ref: '#/components/schemas/CIFormField'

    UpdateCIClassRequest:
      type: object
      additionalProperties: false
      required:
        - label
      properties:
        label:
          type: string
        category:
          type: string
        description:
          type: string
        icon:
          type: string
        attributes:
          type: array
          items:
            type: string
        form_fields:
          type: array
          items:
            $ref: '#/components/schemas/CIFormField'

    CreateCampaignRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - deadline
        - owner_group_ids
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        deadline:
          type: string
          format: date-time
        owner_group_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    UpdateCampaignRequest:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [active, closed, archived]
        title:
          type: string
          minLength: 1
          maxLength: 255
        deadline:
          type: string
          format: date-time

    CampaignInvitation:
      type: object
      additionalProperties: false
      required:
        - invitation_id
        - owner_group_id
        - owner_group_name
        - department_name
        - team_lead_name
        - team_lead_email
        - invitation_url
        - expires_at
      properties:
        invitation_id:
          type: string
          format: uuid
        owner_group_id:
          type: string
          format: uuid
        owner_group_name:
          type: string
        department_name:
          type: string
        team_lead_name:
          type: string
        team_lead_email:
          type: string
          format: email
        invitation_url:
          type: string
        expires_at:
          type: string
          format: date-time

    CampaignResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - status
        - deadline
        - created_at
        - invitations
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [active, closed, archived]
        deadline:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/CampaignInvitation'

    DepartmentProgress:
      type: object
      additionalProperties: false
      required:
        - department_name
        - total_invitations
        - sent_count
        - opened_count
        - submitted_count
        - overdue_count
      properties:
        department_name:
          type: string
        total_invitations:
          type: integer
        sent_count:
          type: integer
        opened_count:
          type: integer
        submitted_count:
          type: integer
        overdue_count:
          type: integer

    CampaignProgressResponse:
      type: object
      additionalProperties: false
      required:
        - campaign_id
        - title
        - status
        - deadline
        - total_invitations
        - total_sent
        - total_opened
        - total_submitted
        - total_overdue
        - departments
      properties:
        campaign_id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [active, closed, archived]
        deadline:
          type: string
          format: date-time
        total_invitations:
          type: integer
        total_sent:
          type: integer
        total_opened:
          type: integer
        total_submitted:
          type: integer
        total_overdue:
          type: integer
        departments:
          type: array
          items:
            $ref: '#/components/schemas/DepartmentProgress'

    IntakeContextResponse:
      type: object
      additionalProperties: false
      required:
        - invitation_id
        - campaign_id
        - campaign_title
        - deadline
        - owner_group_id
        - owner_group_name
        - department_name
        - team_lead_name
        - team_lead_email
        - status
        - lock_version
        - existing_cis
      properties:
        invitation_id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
        campaign_title:
          type: string
        deadline:
          type: string
          format: date-time
        owner_group_id:
          type: string
          format: uuid
        owner_group_name:
          type: string
        department_name:
          type: string
        team_lead_name:
          type: string
        team_lead_email:
          type: string
          format: email
        status:
          type: string
          enum: [sent, opened, submitted, expired]
        draft_payload:
          type: object
          additionalProperties: true
        lock_version:
          type: integer
        existing_cis:
          type: array
          items:
            $ref: '#/components/schemas/CIEnvelope'

    SaveDraftRequest:
      type: object
      additionalProperties: false
      required:
        - payload
      properties:
        payload:
          type: object
          additionalProperties: true

    SaveDraftResponse:
      type: object
      additionalProperties: false
      required:
        - invitation_id
        - lock_version
        - updated_at
        - payload
      properties:
        invitation_id:
          type: string
          format: uuid
        lock_version:
          type: integer
        updated_at:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true

    CISearchResult:
      type: object
      additionalProperties: false
      required:
        - ci
        - ownership
