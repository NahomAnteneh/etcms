openapi: 3.0.3
info:
  title: etcms Configuration Management System API
  version: 3.0.0
  description: Enterprise-grade manual-first Configuration Management System (CMS) backend.
servers:
  - url: /
paths:
  /api/v1/healthz:
    get:
      summary: Liveness probe
      operationId: getHealthz
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/readyz:
    get:
      summary: Readiness probe
      operationId: getReadyz
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Service is not ready
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/health/metrics:
    get:
      summary: CMDB governance health metrics API
      operationId: getHealthMetrics
      tags:
        - Health
        - Governance
      security:
        - BearerAuth: []
        - DevAuth: []
      parameters:
        - name: owner_group_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Optional filter by specific owner group ID
      responses:
        '200':
          description: CMDB governance health metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthMetricsResponse'
        '400':
          description: Bad request (invalid UUID format)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Owner group not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/login:
    post:
      summary: Authenticate user credentials and create a session
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Invalid email or password
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/logout:
    post:
      summary: Terminate the active authenticated session
      operationId: logout
      security:
        - BearerAuth: []
        - DevAuth: []
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/sessions:
    get:
      summary: List all active sessions
      operationId: listSessions
      security:
        - BearerAuth: []
        - DevAuth: []
      responses:
        '200':
          description: List of active sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSessionResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/sessions/{id}:
    delete:
      summary: Revoke an active session by session ID
      operationId: deleteSession
      security:
        - BearerAuth: []
        - DevAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Session terminated
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/users/me:
    get:
      summary: Get currently authenticated user profile
      operationId: getCurrentUser
      security:
        - BearerAuth: []
        - DevAuth: []
      responses:
        '200':
          description: Authenticated user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/owner-groups:
    get:
      summary: List all owner groups
      operationId: listOwnerGroups
      security:
        - BearerAuth: []
        - DevAuth: []
      responses:
        '200':
          description: List of owner groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OwnerGroup'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      summary: Create an owner group
      operationId: createOwnerGroup
      security:
        - BearerAuth: []
        - DevAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOwnerGroupRequest'
      responses:
        '201':
          description: Owner group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerGroup'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden (Admin only)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/owner-groups/{id}:
    put:
      summary: Update an owner group
      operationId: updateOwnerGroup
      security:
        - BearerAuth: []
        - DevAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOwnerGroupRequest'
      responses:
        '200':
          description: Owner group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerGroup'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden (Admin only)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Owner group not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      summary: Delete an owner group
      operationId: deleteOwnerGroup
      security:
        - BearerAuth: []
        - DevAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Owner group deleted
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden (Admin only)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Owner group not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/intake/campaigns:
    get:
      summary: List all decentralized intake campaigns
      operationId: listIntakeCampaigns
      security:
        - BearerAuth: []
        - DevAuth: []
      responses:
        '200':
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampaignResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      summary: Create a decentralized intake campaign
      operationId: createIntakeCampaign
      security:
        - BearerAuth: []
        - DevAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
      responses:
        '201':
          description: Intake campaign created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden - requires platform_admin role
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Unprocessable entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/intake/campaigns/{id}:
    get:
      summary: Get intake campaign details
      operationId: getIntakeCampaign
      security:
        - BearerAuth: []
        - DevAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Campaign details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Campaign not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      summary: Update intake campaign status or properties
      operationId: updateIntakeCampaign
      security:
        - BearerAuth: []
        - DevAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCampaignRequest'
      responses:
        '200':
          description: Campaign updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Campaign not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      summary: Delete an intake campaign and all associated invitations and submissions
      operationId: deleteIntakeCampaign
      security:
        - BearerAuth: []
        - DevAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Campaign deleted successfully
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Campaign not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/intake/campaigns/{id}/progress:
    get:
      summary: Get intake campaign progress by department
      operationId: getCampaignProgress
      security:
        - BearerAuth: []
        - DevAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Campaign progress breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignProgressResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Campaign not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/intake/{token}:
    get:
      summary: Resolve intake invitation magic link token
      operationId: getIntakeInvitation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Intake invitation context and active draft
          headers:
            ETag:
              schema:
                type: string
              description: Current draft lock version quoted e.g. "1"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeContextResponse'
        '401':
          description: Token expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Token not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      summary: Auto-save intake draft
      operationId: saveIntakeDraft
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
          description: Quoted or raw lock version string (e.g. "1")
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDraftRequest'
      responses:
        '200':
          description: Draft auto-saved successfully
          headers:
            ETag:
              schema:
                type: string
              description: Updated draft lock version quoted e.g. "2"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveDraftResponse'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Token expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Token not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
          description: Precondition Failed - Optimistic lock version conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '413':
          description: Payload Too Large - Exceeds 2MB limit
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/intake/{token}/submit:
    post:
      summary: Submit intake and publish baseline
      operationId: submitIntake
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: Optional idempotency key for safe retries
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitIntakeRequest'
      responses:
        '200':
          description: Baseline already published (idempotent retry)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineResponse'
        '201':
          description: Baseline published successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineResponse'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Token expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Token not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict - Submission already finalized or state conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Unprocessable Entity - Validation or Anti-ITAM errors
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/cis/search:
    get:
      summary: Search configuration items
      operationId: searchCIs
      security:
        - BearerAuth: []
        - DevAuth: []
        - IntakeTokenAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Trigram or prefix search query string
        - name: ci_class
          in: query
          required: false
          schema:
            type: string
            enum:
              - business_service
              - application
              - database
              - vm_cluster
              - physical_host
              - network_firewall
        - name: environment
          in: query
          required: false
          schema:
            type: string
            enum:
              - prod
              - dr
              - staging
        - name: owner_group_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: lifecycle_state
          in: query
          required: false
          schema:
            type: string
            enum:
              - in_service
              - synced
              - out_of_sync
              - planned
              - deprecated
              - retired
          description: Filter by CI lifecycle or sync status
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CISearchResponse'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/owner-groups/me/digest:
    get:
      summary: Get active digest cycle and queued items for caller's owner group
      operationId: getActiveDigest
      tags:
        - Digests
      security:
        - BearerAuth: []
        - DevAuth: []
      parameters:
        - name: owner_group_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Optional owner group ID (defaults to authenticated user's primary owner group)
      responses:
        '200':
          description: Active digest cycle and queued CIs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveDigestResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden (user does not belong to owner group and is not platform admin)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found (user has no primary owner group or group not found)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/digests/trigger:
    post:
      summary: Manually trigger digest scheduler run (ops / testing)
      operationId: triggerDigestRun
      tags:
        - Admin
        - Digests
      security:
        - BearerAuth: []
        - DevAuth: []
      responses:
        '200':
          description: Digest cycle run triggered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigestTriggerResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden (strictly restricted to platform_admin)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/audit-logs/export:
    get:
      summary: Stream immutable audit logs exported in CSV or NDJSON format
      operationId: exportAuditLogs
      tags:
        - Audit
      security:
        - BearerAuth: []
        - DevAuth: []
      parameters:
        - name: owner_group_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter audit logs by affected owner group ID (required for non-admin)
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv, ndjson]
            default: csv
          description: Export format
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Start of audit window filter
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: End of audit window filter
      responses:
        '200':
          description: Exported audit logs stream
          headers:
            Content-Disposition:
              schema:
                type: string
              description: File attachment directive
          content:
            text/csv:
              schema:
                type: string
            application/x-ndjson:
              schema:
                type: string
        '400':
          description: Bad request (invalid UUID or date-time)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden (non-admin attempting to export without owner group or foreign group)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/owner-groups/pending-edges:
    get:
      summary: List pending cross-boundary edges awaiting confirmation
      operationId: listPendingEdges
      tags:
        - Edges
      security:
        - BearerAuth: []
        - DevAuth: []
      parameters:
        - name: owner_group_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Optional filter by specific target owner group ID
      responses:
        '200':
          description: List of pending edges awaiting confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingEdgesResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/edges/{id}/confirm:
    post:
      summary: Confirm cross-boundary edge handshake
      operationId: confirmEdge
      tags:
        - Edges
      security:
        - BearerAuth: []
        - DevAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Edge confirmed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
