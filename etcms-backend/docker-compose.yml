services:
  postgres:
    image: postgres:16-alpine
    container_name: etcms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: etcms
      POSTGRES_PASSWORD: etcms_password
      POSTGRES_DB: etcms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etcms -d etcms"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
