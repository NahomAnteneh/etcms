services:
  postgres:
    image: postgres:16-alpine
    container_name: etcms-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: etcms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etcms_prod_secret}
      POSTGRES_DB: etcms
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etcms -d etcms"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: etcms-backend:prod
    build:
      context: ./etcms-backend
      dockerfile: Dockerfile
    container_name: etcms-prod-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://etcms:${POSTGRES_PASSWORD:-etcms_prod_secret}@postgres:5432/etcms?sslmode=disable
      AUTO_MIGRATE: "true"
      ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://frontend:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: etcms-frontend:prod
    build:
      context: ./etcms-frontend
      dockerfile: Dockerfile
    container_name: etcms-prod-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      - backend

  worker:
    image: etcms-backend:prod
    build:
      context: ./etcms-backend
      dockerfile: Dockerfile
    container_name: etcms-prod-worker
    restart: unless-stopped
    command: ["/app/etcms-worker"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://etcms:${POSTGRES_PASSWORD:-etcms_prod_secret}@postgres:5432/etcms?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata_prod:
